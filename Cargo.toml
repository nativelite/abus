[package]
name = "abus"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "The coordination layer for a team of agents: a shared source-of-truth board (key→fields) and a topic-routed pub/sub bus (fyi vs decision_needed, backpressure built in). Pure logic, snapshot-persistable. Zero third-party dependencies — depends only on the nativelite json crate."
license = "MIT"
repository = "https://github.com/nativelite/abus"
keywords = ["agents", "coordination", "pubsub", "board", "nativelite"]
categories = ["command-line-utilities", "data-structures"]

# nativelite core rule: ZERO third-party dependencies. The only dependency
# allowed is the org crate `json` (the app-variant rule): do not add anything
# from crates.io here.
[dependencies]
json = { git = "https://github.com/nativelite/json-rs", branch = "main" }

[lib]
name = "abus"
path = "src/lib.rs"
